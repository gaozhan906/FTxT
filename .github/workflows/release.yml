name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Satu tag (opsional)'
        required: false
        type: string
      tags:
        description: 'Daftar tag dipisah koma (opsional)'
        required: false
        type: string
      all_remaining:
        description: 'Proses semua tag yang belum punya release'
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build tag list
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TAGS: ${{ inputs.tags }}
          INPUT_ALL: ${{ inputs.all_remaining }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$INPUT_ALL" = "true" ]; then
            ALL=$(git tag -l | sort)
            RELEASED=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | sort)
            LIST=$(comm -23 <(printf '%s\n' "$ALL" | sed '/^$/d') <(printf '%s\n' "$RELEASED" | sed '/^$/d'))
          elif [ -n "$INPUT_TAGS" ]; then
            LIST="$INPUT_TAGS"
          elif [ -n "$INPUT_TAG" ]; then
            LIST="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            LIST="$REF_NAME"
          else
            echo "Error: isi tag/tags atau aktifkan all_remaining"
            exit 1
          fi

          TAGS=$(printf '%s' "$LIST" | tr ',' '\n' | tr -s '[:space:]' '\n' | sed '/^$/d' | awk '!seen[$0]++')
          JSON=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            t="${t//\"/}"
            JSON="${JSON:+$JSON,}\"$t\""
          done <<< "$TAGS"

          if [ -z "$JSON" ]; then
            echo "Tidak ada tag untuk diproses"
            exit 1
          fi

          echo "Jumlah tag: $(printf '%s\n' "$TAGS" | awk 'NF{n++} END{print n}')"
          printf '%s\n' "$TAGS"
          echo "matrix={\"tag\":[$JSON]}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.tag }}

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Install SDK components
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Checking KEYSTORE_BASE64 secret availability"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi

          mkdir -p key
          echo "Decoding keystore to key/audiplay-release-key.jks (content suppressed)"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > key/audiplay-release-key.jks || { echo "Failed to decode KEYSTORE_BASE64"; exit 1; }

          echo "Keystore decoded. File info:"
          ls -l key/audiplay-release-key.jks || true
          file key/audiplay-release-key.jks || true

      - name: Generate keystore.properties for signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties << EOF
          storeFile=../key/audiplay-release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore.properties created"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Debug APK Files
        run: |
          find . -type f -name "*.apk"

      - name: Extract Release Notes
        id: changelog
        env:
          REF: ${{ matrix.tag }}
        run: |
          # Strip "v" and optional leading dot prefix from tag name
          VERSION="${REF#v}"
          VERSION="${VERSION#.}"

          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^\"? *#+ *\\[" ver "\\]" { found=1; skip=0; next }
            found && /^"? *#+ *\[/ { exit }
            found && /^#+ / {
              if ($0 ~ /🗒️ File Added|✏️ File Changed|🔥 File Removed/) {
                skip=1; next
              }
              skip=0
            }
            found && !skip { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            for f in old-CHANGELOG.md app/src/main/assets/old-CHANGELOG.md; do
              [ -f "$f" ] || continue
              NOTES=$(awk -v ver="$VERSION" '
                $0 ~ "^\"? *#+ *\\[" ver "\\]" { found=1; skip=0; next }
                found && /^"? *#+ *\[/ { exit }
                found && /^#+ / {
                  if ($0 ~ /🗒️ File Added|✏️ File Changed|🔥 File Removed/) {
                    skip=1; next
                  }
                  skip=0
                }
                found && !skip { print }
              ' "$f")
              [ -n "$NOTES" ] && break
            done
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag }}
          files: |
            **/build/outputs/apk/release/*.apk
          body: ${{ steps.changelog.outputs.notes }}
